; Step 1 of the small-steps ladder: HC-SR04 distance meter, prints centimetres to the PC.
; Wiring (4 female-female jumpers): Vcc -> 3V3, Gnd -> GND, Trig -> D25, Echo -> D26.
;   pio run -t upload --upload-port COMx      (check ports: pio device list)
;   pio device monitor --port COMx

[env:esp32dev]
; Same exact versions as radio-hello, so every project builds with the tested toolchain.
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Same sensor, and also publishes each reading (cm) to NATS for WireClaw:
;   pio run -e nats -t upload --upload-port COMx
; Needs src/secrets.h (copy secrets.example.h) and the NATS server (tools/nats/docker-compose.yml).
[env:nats]
extends = env:esp32dev
build_flags =
  -DNATS_PUBLISH
  -DNATS_HOST=\"192.168.1.151\"
  -DNATS_PORT=4222
  -DNATS_SUBJECT=\"sensors.distance\"
