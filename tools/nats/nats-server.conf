# NATS server for WireClaw (firmware/wireclaw). Runs in Docker, see docker-compose.yml.
#   4222  normal NATS port: the ESP32 board connects here (config.json "nats_host")
#   8080  WebSocket port: the browser chat page (tools/nats/wireclaw-chat.html) connects here
#   8222  monitoring page: http://localhost:8222/connz lists who is connected
# No passwords: home network only. Do not forward these ports on the router.

port: 4222
http_port: 8222

# Logs why each client connection closes ("Client connection closed: <reason>").
# Turned on 2026-11-20 to find WireClaw's repeated disconnects.
debug: true

websocket {
  port: 8080
  no_tls: true
}
