; "ESP-NOW hello": the same ask/answer test as radio-hello, but over the ESP32's own
; Wi-Fi radio (2.4 GHz, ESP-NOW, no router), to compare range on the same walk route.
;   pio run -e <env> -t upload --upload-port COMx      (check ports: pio device list)
; Both boards record their log to flash: tools/flash_dump.py COMx logs/file.txt

[env]
; Same versions as radio-hello (tested there 2026-11-10).
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -D FLASH_LOG

[env:sender]
; Asks "hello #n" once a second, waits for "ack #n". Joins the phone hotspot for the live
; page and the phone's GPS (Automate app -> /loc), like radio-hello's sender_web.
build_flags = ${env.build_flags} -D ROLE_SENDER -D WEB_LOG

[env:receiver]
; Answers every hello. Finds the hotspot's channel by scanning (it never joins it).
build_flags = ${env.build_flags} -D ROLE_RECEIVER
