; "Hello radio": two ESP32 + CC1101 boards. One sends, one receives.
; Same code for both boards; the ROLE flag picks which one it becomes.
;   Sender:   pio run -e sender   -t upload
;   Receiver: pio run -e receiver -t upload
; Then open the Serial Monitor: pio device monitor

[env]
; Exact versions, so another computer builds the same firmware we tested (2026-11-10).
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@7.8.1
build_src_filter = +<*> -<diag.cpp>

[env:diag]
; Wiring check: finds which ESP32 pin the CC1101's GDO0 (pin 3) is wired to.
build_flags = -D RADIOLIB_GODMODE
build_src_filter = +<diag.cpp>

[env:sender]
build_flags = -D ROLE_SENDER

[env:receiver]
build_flags = -D ROLE_RECEIVER

[env:receiver_debug]
; Receiver + radio status printout every 2 s (diagnostics only)
build_flags = -D ROLE_RECEIVER -D RX_DEBUG -D RADIOLIB_GODMODE
