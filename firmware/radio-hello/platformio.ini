; "Hello radio": two ESP32 + CC1101 boards. The sender asks "hello #n", the receiver
; answers "ack #n". Same code for both boards; the ROLE flag picks the job.
;   pio run -e <env> -t upload --upload-port COMx      (check ports: pio device list)
; *_web envs join the phone hotspot (src/secrets.h) and serve a live page.

[env]
; Exact versions, so another computer builds the same firmware we tested (2026-11-10).
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = jgromes/RadioLib@7.8.1
; GODMODE: lets our code write CC1101 registers RadioLib doesn't set (see apply433MHzFixes).
build_flags = -D RADIOLIB_GODMODE

[env:sender]
build_flags = ${env.build_flags} -D ROLE_SENDER

[env:sender_web]
; Sender + Wi-Fi: joins the phone hotspot, takes the phone's GPS from the Automate app
; (http://<board>/loc?lat=..&lon=..&acc=..) and shows a live page with distance + answers.
build_flags = ${env.build_flags} -D ROLE_SENDER -D WEB_LOG

[env:sender_steps]
; Desk sensitivity test: sender steps its power 0/-10/-15/-20/-30 dBm, 30 messages each.
build_flags = ${env.build_flags} -D ROLE_SENDER -D POWER_STEPS

[env:receiver]
build_flags = ${env.build_flags} -D ROLE_RECEIVER

[env:receiver_rec]
; Receiver + flash recorder: logs every line to the board's flash (LittleFS), so it can
; run on a power bank away from the PC. Read it afterwards: tools/flash_dump.py
build_flags = ${env.build_flags} -D ROLE_RECEIVER -D FLASH_LOG

[env:noise]
; Noise meter: listens only, prints the background noise at 434 MHz every second.
build_flags = ${env.build_flags} -D ROLE_NOISE

[env:noise_web]
; Noise meter + phone page (joins the hotspot), to carry around.
build_flags = ${env.build_flags} -D ROLE_NOISE -D WEB_LOG

