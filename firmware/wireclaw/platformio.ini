; WireClaw - ESP32 AI Agent (upstream: github.com/M64GitHub/WireClaw @ ad84614)
; Local copy, ported to the classic ESP32 (our HW-394): see PORT-NOTES.md.
;
; Run pio from PowerShell, NOT Git Bash: pioarduino refuses to install its
; compiler under MSYS ("MSys/Mingw is not supported").
;
; Build:   pio run                    (builds default target: esp32 = our HW-394)
; Upload:  pio run -t upload
; Monitor: pio device monitor
; FS:      pio run -t uploadfs
;
; Other targets: pio run -e esp32-s3, pio run -e esp32, pio run -e esp32-c3

[platformio]
default_envs = esp32
; Own PlatformIO folder: pioarduino and the official espressif32 platform
; (used by our other projects) overwrite each other's packages in ~/.platformio.
core_dir = C:/pioa

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = colorize, time

[env:esp32-c6]
board = esp32-c6-devkitc-1
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

[env:esp32-s3]
board = esp32-s3-devkitc-1

; Classic ESP32 (HW-394, esp32dev). Upstream left this disabled because static
; buffers overflowed dram0_0_seg; include/big_static.h moves them to the heap.
[env:esp32]
board = esp32dev

[env:esp32-c3]
board = esp32-c3-devkitm-1
